[versions]
# 降级到支持 API 17 的构建链（AGP 7.4.2 需 Gradle 7.5 + JDK 11-17）
agp = "7.4.2"
coreKtx = "1.9.0"
lifecycleRuntimeKtx = "2.6.2"
activity = "1.5.1"
kotlin = "1.9.22"
appcompat = "1.6.1"
appProjected = "1.2.0"
appAutomotive = "1.2.0"
app = "1.2.0"
junit = "4.13.2"
bouncycastle = "1.70"
# jmdns 改用 vendored 模块 :legacy-mdns（JmDNS 3.6.3 + API17 多播 SO_REUSEADDR 补丁）
desugarJdk = "2.0.4"
multidex = "2.0.1"
constraintlayout = "2.1.4"
fragment = "1.5.7"
coroutines = "1.7.3"
robolectric = "4.9"
mockito = "5.2.0"
# media3 1.1.1：minSdk 21，保留车机视频播放；API 17-20 设备靠运行时版本保护
media3 = "1.1.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-fragment = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragment" }
androidx-app-projected = { group = "androidx.car.app", name = "app-projected", version.ref = "appProjected" }
androidx-app-automotive = { group = "androidx.car.app", name = "app-automotive", version.ref = "appAutomotive" }
androidx-app = { group = "androidx.car.app", name = "app", version.ref = "app" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
bouncycastle = { group = "org.bouncycastle", name = "bcprov-jdk15on", version.ref = "bouncycastle" }
desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugarJdk" }
androidx-multidex = { group = "androidx.multidex", name = "multidex", version = "2.0.1" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-exoplayer-hls = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "media3" }
androidx-media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
